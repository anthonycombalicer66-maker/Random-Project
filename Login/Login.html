<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="./style.css">
    
</head>
<body>
    <header>
    <div class="logo">
        <img src="./images/burger.png" alt="Biterush logo">
        <h3 class="biterush-title">BiteRush</h3>
        </div>
    <div class="page-title">Log In</div>
    </header>

    <main class="main">
        <section class="brand-section">
          <img src="./images/burger.png" alt="image-center">
          <h1 class="biterush-center">BiteRush</h1>
          <p>Rush your cravings.</p>
        </section>

        <section class="login-box">
            <h2>Log In</h2>

            <!--email-->
            <form action="#" class="login-form">
            <div class="input-group email">
                <input type="text" placeholder="Phone number/Username/Email" required>
            </div>
            <!---password-->
            <div class="password">
                <input type="password" placeholder="Password" required>
                <i class="fa-regular fa-eye-slash toggle-password"></i>
            </div>

            <!---login button-->
            <button type="submit" class="button-primary">Log In</button>

            <a href="#" class="forgot-password">Forgot Password</a>

            <div class="line">
                <span>OR</span>
            </div>
            </form>
        </section>
    </main>

</body>
</html>
