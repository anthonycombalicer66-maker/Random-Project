<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="./style.css">
     <!-- fontAwesome for social media & eye icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- top navigation -->
    <header class="navbar">
    <div class="logo">
        <img src="./images/burger.png" alt="Biterush logo">
        <h3 class="biterush-title">BiteRush</h3>
        </div>
    <div class="page-title">Log In</div>
    </header>

    <!-- main contents -->
    <main class="main">

        <!-- left section branding and title -->
        <section class="brand-section">
          <img src="./images/burger.png" alt="image-center" class="burger-mascot">
          <h1 class="biterush-center">BiteRush</h1>
          <p>Rush your cravings.</p>
        </section>

        <section class="login-box">
            <div class="login-header">
                <h2>Log In</h2>
                <!-- qr code -->
            <div class="qr-section">
                <span class="qr-notif">Log in with QR</span>
                <i class="fa-solid fa-qrcode qr-icon"></i>
            </div>
            </div>

            <!--email-->
            <form action="#" class="login-form">
            <div class="input-group email">
                <input type="text" placeholder="Phone number/Username/Email" required>
            </div>
            <!---password-->
            <div class="input-group password-group">
                <input type="password" placeholder="Password" required>
                <i class="fa-regular fa-eye-slash toggle-password"></i>
            </div>

            <!---login button-->
            <button type="submit" class="button-primary">Log In</button>

            <a href="#" class="forgot-password">Forgot Password</a>

            <div class="line">
                <span>OR</span>
            </div>

            <div class="social-buttons">
                <button type="button" class="btn-social">
                    <i class="fa-brands fa-facebook" style="color: #1877f2;"></i> Facebook
                </button>
                <button type="button" class="btn-social">
                    <i class="fa-brands fa-google" style="color: #ea4335;"></i> Google
                </button>
            </div>

            <!-- footer sign up-->
             <p class="signup-prompt">New to BiteRush? <a href="#">Sign up</a></p>
            </form>
        </section>
    </main>

</body>
</html>
