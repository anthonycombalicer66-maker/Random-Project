<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiteRush Log In</title>
  <link rel="stylesheet" href="teststyle.css">
  <!-- FontAwesome for Social Media & Eye Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="logo">
      <img src="burger-logo.png" alt="BiteRush Logo">
      <span class="brand-title">BiteRush</span>
    </div>
    <div class="page-title">Log In</div>
  </header>

  <!-- Main Content Area -->
  <main class="main-container">
    
    <!-- Left Section: Branding and Illustration -->
    <section class="brand-section">
      <img src="burger-illustration.png" alt="BiteRush Mascot" class="mascot">
      <h1 class="brand-heading">BiteRush</h1>
      <p class="tagline">Rush your cravings.</p>
    </section>

    <!-- Right Section: Login Form Box -->
    <section class="login-card">
      
      <!-- Top Right QR Code Option -->
      <div class="qr-option">
        <span class="qr-tooltip">Log In with QR</span>
        <i class="fa-solid fa-qrcode qr-icon"></i>
      </div>

      <h2>Log In</h2>

      <form action="#" class="login-form">
        <!-- Input 1: Username/Email -->
        <div class="input-group">
          <input type="text" placeholder="Phone number / Username / Email" required>
        </div>

        <!-- Input 2: Password -->
        <div class="input-group password-group">
          <input type="password" placeholder="Password" required>
          <i class="fa-regular fa-eye-slash toggle-password"></i>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-primary">Log In</button>

        <a href="#" class="forgot-password">Forgot Password</a>

        <!-- Divider -->
        <div class="divider">
          <span>OR</span>
        </div>

        <!-- Social Login Buttons -->
        <div class="social-buttons">
          <button type="button" class="btn-social">
            <i class="fa-brands fa-facebook" style="color: #1877f2;"></i> Facebook
          </button>
          <button type="button" class="btn-social">
            <i class="fa-brands fa-google" style="color: #ea4335;"></i> Google
          </button>
        </div>

        <!-- Footer Sign-up Link -->
        <p class="signup-prompt">New to BiteRush? <a href="#">Sign up</a></p>
      </form>
    </section>

  </main>

</body>
</html>
