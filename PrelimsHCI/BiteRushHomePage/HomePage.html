<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="HomePageKulay.css">
    <title>BiteRush - Home</title>
</head>
<body>

    <nav>
        <div class="logo-section">
            <img src="/BiteRushHomePage/HomePagePics/burger.png" alt="BiteRush Logo">
            <h1>BiteRush</h1>
        </div>

        <div class="user-profile">
            <img src="/BiteRushHomePage/HomePagePics/image 108.png" alt="User Profile">
        </div>
    </nav>

    <div class="filter-cart-row">
        <div class="filter-bar">
            <button class="filter-btn active">All</button>
            <button class="filter-btn">Breakfast</button>
            <button class="filter-btn">Lunch</button>
            <button class="filter-btn">Dinner</button>
            <button class="filter-btn">Burger and Fries</button>
            <button class="search-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
        </div>

        <button class="cart-btn" aria-label="Shopping Cart">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
        </button>
    </div>

    <main class="hero-container">

        <div class="hero-content">
            <span class="badge">BITERUSH BESTSELLER</span>
            
            <h1 class="hero-title">
                THE INFAMOUS<br>CHEESE BURGER
            </h1>

            <p class="hero-desc">
                A classic beef, melted cheese, fresh toppings<br>
                nostalgic Flavor in a bun
            </p>

            <div class="cta-row">
                <button class="order-btn">ORDER NOW</button>
                <span class="price">₱179</span>
            </div>

            <div class="cards-preview">
                <div class="preview-card">
                    <img src="/BiteRushHomePage/HomePagePics/image 53.png" alt="The Bacon Cheese Burger">
                    <div class="card-info">
                        <div class="stars">★★★★★</div>
                        <h4>The Bacon Cheese Burger</h4>
                        <span class="card-price">₱189</span>
                    </div>
                </div>

                <div class="preview-card active-card">
                    <img src="/BiteRushHomePage/HomePagePics/image 54.png" alt="The Infamous Cheese Burger">
                    <div class="card-info">
                        <div class="stars">★★★★★</div>
                        <h4>The Infamous Cheese Burger</h4>
                        <span class="card-price">₱179</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="hero-image-wrapper">
            <div class="yellow-glow"></div>

            <img src="/BiteRushHomePage/HomePagePics/image 49.png" alt="Tomato Slice Top" class="floating-img float-tomato-top">
            <img src="/BiteRushHomePage/HomePagePics/image 52.png" alt="Lettuce Right" class="floating-img float-lettuce-right">
            <img src="/BiteRushHomePage/HomePagePics/image 52.png" alt="Lettuce Bottom" class="floating-img float-lettuce-bottom">
            <img src="/BiteRushHomePage/HomePagePics/image 49.png" alt="Tomato Slice Bottom" class="floating-img float-tomato-bottom">

            <img src="/BiteRushHomePage/HomePagePics/image 48.png" alt="Featured Cheese Burger" class="main-burger-img">
        </div>

    </main>

</body>
</html>
